<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyOps Navigation Pro V.00</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS untuk Real Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        skyops: {
                            dark: '#0B1120',
                            panel: 'rgba(15, 23, 42, 0.7)',
                            accent: '#06b6d4',
                            glow: 'rgba(6, 182, 212, 0.5)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B1120;
            background-image: 
                radial-gradient(at 0% 0%, hsla(217, 100%, 16%, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(189, 100%, 20%, 0.5) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .fade-in { animation: fadeIn 1.5s ease-in forwards; }
        .fade-out { animation: fadeOut 1.5s ease-out forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .glass-panel {
            background: var(--tw-colors-skyops-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .tech-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: white;
            transition: all 0.3s ease;
        }
        .tech-input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .btn-tech {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            transition: all 0.3s ease;
        }

        /* GPS ACTIVE PULSE */
        .gps-active {
            background-color: rgba(6, 182, 212, 0.6) !important;
            border-color: #06b6d4 !important;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
            animation: pulse-gps 2s infinite;
        }
        @keyframes pulse-gps {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* FIX PRINT PDF */
        @media print {
            @page { size: A4; margin: 0; }
            body > *:not(#print-area) { display: none !important; }
            #print-area { 
                display: block !important; 
                visibility: visible !important; 
                position: absolute; 
                left: 0; top: 0; width: 100%; 
                background: white !important;
            }
            #print-area * { color: black !important; visibility: visible !important; }
        }

        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-sm md:text-base">

    <!-- Notifikasi Toast -->
    <div id="toast" class="fixed top-5 right-5 z-[100] transform transition-all duration-300 translate-x-full opacity-0">
        <div id="toast-panel" class="glass-panel border-l-4 border-cyan-400 text-white px-6 py-4 rounded shadow-lg flex items-center gap-3">
            <span id="toast-icon-container"><i data-lucide="info" class="text-cyan-400 w-5 h-5"></i></span>
            <span id="toast-msg" class="font-medium">Notification</span>
        </div>
    </div>

    <!-- AREA CETAK -->
    <div id="print-area" class="hidden"></div>

    <!-- 1. SPLASH SCREEN -->
    <div id="screen-splash" class="fixed inset-0 z-50 flex items-center justify-center bg-skyops-dark fade-in">
        <div class="text-center">
            <i data-lucide="plane" class="w-24 h-24 text-cyan-400 mx-auto mb-6 animate-pulse"></i>
            <h1 class="font-tech text-4xl md:text-6xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">SkyOps</h1>
            <h2 class="text-xl md:text-2xl text-slate-300 font-light tracking-[0.2em] uppercase">Navigation Pro V.00</h2>
            <div id="loading-text" class="text-xs text-cyan-500 font-mono mt-4">Connecting to Cloud...</div>
        </div>
    </div>

    <!-- 2. LOGIN SCREEN -->
    <div id="screen-login" class="hidden-screen min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-8 slide-up">
            <div class="text-center mb-8">
                <h2 class="font-tech text-3xl font-bold text-white tracking-wide">SYSTEM LOGIN</h2>
                <p class="text-slate-400 text-sm mt-2">Database Cloud Active</p>
            </div>
            <form id="login-form" class="space-y-5">
                <input type="text" id="login-user" required class="tech-input w-full p-3 rounded-lg" placeholder="ID Operator">
                <input type="password" id="login-pass" required class="tech-input w-full p-3 rounded-lg" placeholder="Password">
                <button type="submit" class="btn-tech w-full text-white font-bold py-3 rounded-lg uppercase">Initialize System</button>
            </form>
        </div>
    </div>

    <!-- 3. ADMIN & 4. MAIN (Struktur Tab dan Header tetap sama seperti sebelumnya) -->
    <!-- (Bagian ini disingkat demi fokus pada logika sinkronisasi Cloud) -->
    
    <!-- (Disisipkan manual bagian Main Dashboard yang diinginkan) -->
    <div id="screen-main" class="hidden-screen min-h-screen flex flex-col">
        <header class="glass-panel border-b border-white/10 p-4">
            <div class="flex justify-between items-center">
                <h1 class="font-tech text-xl text-white">SkyOps Pro V.00</h1>
                <div class="flex gap-4">
                    <span id="cloud-status" class="text-[10px] text-orange-400 font-mono self-center">LOCAL MODE</span>
                    <button onclick="logout()" class="text-red-400 text-xs"><i data-lucide="power" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="flex gap-2 mt-4 overflow-x-auto pb-2">
                <button onclick="switchTab('tab-map')" class="px-4 py-1 text-xs border border-cyan-500/30 rounded text-cyan-400">MAP</button>
                <button onclick="switchTab('tab-route')" class="px-4 py-1 text-xs border border-cyan-500/30 rounded text-cyan-400">ROUTE</button>
                <button onclick="switchTab('tab-waypoint')" class="px-4 py-1 text-xs border border-cyan-500/30 rounded text-cyan-400">DATABASE</button>
                <button onclick="switchTab('tab-aircraft')" class="px-4 py-1 text-xs border border-cyan-500/30 rounded text-cyan-400">AIRCRAFT</button>
            </div>
        </header>

        <main class="flex-1 relative overflow-hidden bg-black">
            <div id="tab-map" class="tab-content h-full w-full absolute inset-0">
                <div id="real-map" class="h-full w-full"></div>
                <button id="btn-recenter" onclick="recenterMap()" class="absolute top-4 right-4 z-[40] p-3 bg-slate-900 border border-cyan-500 text-cyan-400 rounded-full">
                    <i data-lucide="crosshair" class="w-6 h-6"></i>
                </button>
            </div>
            <!-- Container tab lainnya tetap sama fungsinya -->
            <div id="tab-waypoint" class="tab-content hidden p-4 overflow-y-auto h-full">
                <div class="flex justify-between mb-4"><h2 class="text-white">Waypoints</h2><button onclick="openWaypointModal()" class="text-cyan-400">+ New</button></div>
                <div id="waypoint-list" class="space-y-2"></div>
            </div>
            <div id="tab-route" class="tab-content hidden p-4 overflow-y-auto h-full">
                <div id="route-list" class="space-y-4"></div>
            </div>
             <div id="tab-aircraft" class="tab-content hidden p-4 overflow-y-auto h-full">
                <div id="aircraft-list" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <!-- MODAL-MODAL TETAP SAMA SEPERTI SEBELUMNYA -->

    <script>
        // --- KONFIGURASI GOOGLE SHEET URL ---
        // Tempelkan URL Web App hasil Deploy Langkah 1 di sini:
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzaxomh6qUlLWYr6KaPntH41J0lzGJTmavuwWiDpKBU1jGr2uWjJTzLo0xKKbNieaTexg/exec"; 

        var map, gpsMarker, isGPSTracking = false, gpsWatchId = null;

        // --- SISTEM DATABASE CLOUD SINKRON ---

        async function saveDB(data) {
            // 1. Simpan ke Local
            localStorage.setItem('skyops_data', JSON.stringify(data));
            
            // 2. Kirim ke Google Sheet (Cloud)
            if (GOOGLE_SHEET_URL) {
                document.getElementById('cloud-status').innerText = "SYNCING...";
                fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                }).then(() => {
                    document.getElementById('cloud-status').innerText = "CLOUD SYNCED";
                    document.getElementById('cloud-status').className = "text-[10px] text-emerald-400 font-mono self-center";
                }).catch(e => {
                    document.getElementById('cloud-status').innerText = "OFFLINE";
                    document.getElementById('cloud-status').className = "text-[10px] text-red-400 font-mono self-center";
                });
            }
        }

        async function pullFromCloud() {
            if (!GOOGLE_SHEET_URL) return;
            try {
                const response = await fetch(GOOGLE_SHEET_URL);
                const cloudDataText = await response.text();
                if (cloudDataText && cloudDataText.length > 10) {
                    localStorage.setItem('skyops_data', cloudDataText);
                    return true;
                }
            } catch (e) { console.error("Cloud Pull Error", e); }
            return false;
        }

        function getParsedDB() {
            return JSON.parse(localStorage.getItem('skyops_data') || '{"admin":{"username":"admin","password":"ramdan28"},"users":[],"waypoints":[],"aircrafts":[],"routes":[]}');
        }

        // --- LOGIKA GPS REAL-TIME ---
        function recenterMap() {
            if (!navigator.geolocation) return showToast('GPS Not Supported', 'error');
            const btn = document.getElementById('btn-recenter');

            if (isGPSTracking) {
                navigator.geolocation.clearWatch(gpsWatchId);
                isGPSTracking = false;
                btn.classList.remove('gps-active');
                return;
            }

            btn.classList.add('gps-active');
            isGPSTracking = true;
            gpsWatchId = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                if (gpsMarker) {
                    gpsMarker.setLatLng([lat, lng]);
                    map.flyTo([lat, lng], 14);
                }
            }, (err) => {
                showToast('GPS Signal Lost', 'error');
                btn.classList.remove('gps-active');
                isGPSTracking = false;
            }, { enableHighAccuracy: true });
        }

        // --- INISIALISASI APLIKASI ---
        window.onload = async () => {
            lucide.createIcons();
            
            // Tarik data terbaru dari Google Sheets saat aplikasi dibuka
            const synced = await pullFromCloud();
            
            setTimeout(() => {
                document.getElementById('screen-splash').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('screen-splash').style.display = 'none';
                    switchScreen('screen-login');
                    if (synced) showToast('Database Synced with Cloud', 'success');
                }, 1000);
            }, 2000);
        };

        function switchScreen(id) {
            document.querySelectorAll('body > div').forEach(el => {
                if(el.id.startsWith('screen-')) el.classList.add('hidden-screen');
            });
            document.getElementById(id).classList.remove('hidden-screen');
        }

        // Handle login form (tetap sama, namun data diambil dari cloud)
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const db = getParsedDB();
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            if (user === db.admin.username && pass === db.admin.password) {
                switchScreen('screen-main');
                initMap();
                renderWaypoints();
                renderRoutes();
                renderAircrafts();
            } else {
                showToast('Invalid Access', 'error');
            }
        };

        function initMap() {
            if (map) return;
            map = L.map('real-map', { zoomControl: false }).setView([3.58, 98.67], 10);
            L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {subdomains:['mt0','mt1','mt2','mt3']}).addTo(map);
            gpsMarker = L.marker([3.58, 98.67]).addTo(map);
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (map) map.invalidateSize();
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => t.classList.add('translate-x-full', 'opacity-0'), 3000);
        }

        function logout() { location.reload(); }
        
        // (Lanjutkan dengan fungsi renderWaypoints(), renderRoutes(), dll dari kode sebelumnya)
        // INGAT: Setiap kali menambah/menghapus data, panggil saveDB(db) agar terkirim ke Google Sheets.

    </script>
</body>
</html>
